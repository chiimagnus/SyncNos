name: Feature request
description: Suggest an idea
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What should it do?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why does it belong in SyncNos?
      description: SyncNos should stay focused. Tell us why this is worth adding to the capture, reading, organization, or sync workflow.
    validations:
      required: true
