name: Bug report
description: Report something that isn't working in SyncNos
title: "[Bug]: "
labels: ["bug"]
body:
  - type: checkboxes
    id: existing-search
    attributes:
      label: Existing issues
      options:
        - label: I searched open and closed issues and didn't find this already reported
          required: false

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      placeholder: |
        What you did, what you expected, and what happened instead.
        A short recording beats a paragraph.
    validations:
      required: true

  - type: textarea
    id: repro-steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recording
      description: Drag and drop images or a screen recording here. Optional but speeds up triage.
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: SyncNos version
      placeholder: 1.9.0 or commit SHA
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser + OS
      placeholder: Chrome 140 on macOS 15.6
    validations:
      required: true
