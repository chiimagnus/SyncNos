name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.15.0 or v1.15.0-beta.1).'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish tagged release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node and npm registry
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Resolve release metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          node .github/scripts/cli/cli-release.mjs metadata "$RELEASE_TAG" > "$RUNNER_TEMP/release-metadata.json"
          node - "$RUNNER_TEMP/release-metadata.json" "$GITHUB_OUTPUT" <<'NODE'
          const fs = require('node:fs');
          const [metadataPath, outputPath] = process.argv.slice(2);
          const value = JSON.parse(fs.readFileSync(metadataPath, 'utf8'));
          fs.appendFileSync(outputPath, [
            `tag=${value.tag}`,
            `version=${value.version}`,
            `channel=${value.channel}`,
            `npm_dist_tag=${value.npmDistTag}`,
            `github_prerelease=${value.githubPrerelease}`,
            '',
          ].join('\n'));
          NODE
          node -e 'const [major, minor] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && minor < 5)) process.exit(1)' "$(npm --version)"

      - name: Preflight release state
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          NPM_DIST_TAG: ${{ steps.metadata.outputs.npm_dist_tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "release tag must point at a commit on main" >&2; exit 1; }

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release already exists: $RELEASE_TAG" >&2
            exit 1
          fi

          npm view @chiimagnus/syncnos dist-tags --json > "$RUNNER_TEMP/npm-dist-tags.json"
          published_version="$(npm view "@chiimagnus/syncnos@${RELEASE_VERSION}" version 2>/dev/null || true)"
          dist_tag_version="$(npm view @chiimagnus/syncnos "dist-tags.${NPM_DIST_TAG}" 2>/dev/null || true)"
          if [[ "$published_version" == "$RELEASE_VERSION" ]]; then
            if [[ "$dist_tag_version" != "$RELEASE_VERSION" ]]; then
              echo "npm exact version exists but ${NPM_DIST_TAG} points to ${dist_tag_version:-nothing}" >&2
              exit 1
            fi
            echo "npm_already_published=true" >> "$GITHUB_OUTPUT"
          else
            node .github/scripts/cli/cli-release.mjs check-order "$RELEASE_VERSION" "$RUNNER_TEMP/npm-dist-tags.json"
            echo "npm_already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run release gate
        run: npm run gate

      - name: Check CLI package contract
        run: npm run cli:check

      - name: Build SyncNos CLI tarball
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          node cli/package.mjs \
            --version "$RELEASE_VERSION" \
            --require-wxt-core-match \
            --out release-artifacts

      - name: Smoke install packaged SyncNos CLI
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          cli_tgz="$PWD/release-artifacts/chiimagnus-syncnos-${RELEASE_VERSION}.tgz"
          test -f "$cli_tgz"
          prefix="$(mktemp -d)"
          npm install -g "$cli_tgz" --prefix "$prefix" --ignore-scripts
          "$prefix/bin/syncnos" --help >/dev/null
          "$prefix/bin/syncnos" capabilities | node -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => (input += chunk));
            process.stdin.on("end", () => {
              const result = JSON.parse(input);
              if (result?.ok !== true || !Number.isInteger(result?.data?.protocolVersion)) process.exit(1);
            });
          '

      - name: Build WebClipper Chrome zip
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          node .github/scripts/webclipper/package-release-assets.mjs \
            --target=chrome \
            --zip \
            --zip-name="syncnos-webclipper-chrome-${RELEASE_TAG}.zip"

      - name: Build WebClipper Edge zip
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          node .github/scripts/webclipper/package-release-assets.mjs \
            --target=edge \
            --out=dist-edge \
            --zip \
            --zip-name="syncnos-webclipper-edge-${RELEASE_TAG}.zip"

      - name: Build WebClipper Firefox XPI
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          node .github/scripts/webclipper/package-release-assets.mjs \
            --target=firefox \
            --zip \
            --zip-name="syncnos-webclipper-firefox-${RELEASE_TAG}.xpi"

      - name: Prepare browser release assets
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          cp "syncnos-webclipper-chrome-${RELEASE_TAG}.zip" "release-artifacts/syncnos-webclipper-chrome-${RELEASE_TAG}.zip"
          cp "syncnos-webclipper-edge-${RELEASE_TAG}.zip" "release-artifacts/syncnos-webclipper-edge-${RELEASE_TAG}.zip"
          cp "syncnos-webclipper-firefox-${RELEASE_TAG}.xpi" "release-artifacts/syncnos-webclipper-firefox-${RELEASE_TAG}.xpi"

      - name: Publish SyncNos CLI to npm
        if: ${{ steps.preflight.outputs.npm_already_published != 'true' }}
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          NPM_DIST_TAG: ${{ steps.metadata.outputs.npm_dist_tag }}
        run: |
          set -euo pipefail
          cli_tgz="$PWD/release-artifacts/chiimagnus-syncnos-${RELEASE_VERSION}.tgz"
          npm publish "$cli_tgz" --access public --tag "$NPM_DIST_TAG"

      - name: Verify npm publication
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          NPM_DIST_TAG: ${{ steps.metadata.outputs.npm_dist_tag }}
        run: |
          set -euo pipefail
          attempt=1
          while [[ "$attempt" -le 12 ]]; do
            published_version="$(npm view "@chiimagnus/syncnos@${RELEASE_VERSION}" version 2>/dev/null || true)"
            dist_tag_version="$(npm view @chiimagnus/syncnos "dist-tags.${NPM_DIST_TAG}" 2>/dev/null || true)"
            if [[ "$published_version" == "$RELEASE_VERSION" && "$dist_tag_version" == "$RELEASE_VERSION" ]]; then
              echo "npm publication visible: ${RELEASE_VERSION} (${NPM_DIST_TAG})"
              exit 0
            fi
            if [[ "$attempt" -lt 12 ]]; then sleep 5; fi
            attempt=$((attempt + 1))
          done
          echo "npm publication is not visible after bounded verification: version=${published_version} ${NPM_DIST_TAG}=${dist_tag_version}" >&2
          exit 1

      - name: Resolve previous stable tag
        if: ${{ steps.metadata.outputs.github_prerelease == 'false' }}
        id: previous
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          previous="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | grep -Fxv "$RELEASE_TAG" | head -n 1 || true)"
          echo "tag=$previous" >> "$GITHUB_OUTPUT"

      - name: Publish stable GitHub Release
        if: ${{ steps.metadata.outputs.github_prerelease == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          set -euo pipefail
          generated_notes="$RUNNER_TEMP/github-generated-release-notes.md"
          release_notes="$RUNNER_TEMP/github-release-notes.md"
          api_args=(--method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f "tag_name=${RELEASE_TAG}")
          if [[ -n "$PREVIOUS_TAG" ]]; then
            api_args+=(-f "previous_tag_name=${PREVIOUS_TAG}")
          fi
          gh api "${api_args[@]}" --jq '.body' > "$generated_notes"
          [[ -s "$generated_notes" ]] || { echo "generated release notes are empty" >&2; exit 1; }

          {
            printf '%s\n\n' '[![Chrome Version](https://img.shields.io/chrome-web-store/v/hmgjflllphdffeocddjjcfllifhejpok?label=Chrome&logo=googlechrome)](https://chromewebstore.google.com/detail/syncnos-webclipper/hmgjflllphdffeocddjjcfllifhejpok) [![Edge Version](https://img.shields.io/badge/dynamic/json?url=https%3A%2F%2Fmicrosoftedge.microsoft.com%2Faddons%2Fgetproductdetailsbycrxid%2Fijkpghlfmkbjcgafapjcjahaikmnjncl&query=%24.version&label=Edge&logo=microsoftedge&color=blue)](https://microsoftedge.microsoft.com/addons/detail/syncnosaiweb-clipper/ijkpghlfmkbjcgafapjcjahaikmnjncl) [![Firefox Version](https://img.shields.io/amo/v/syncnos-webclipper?label=Firefox&logo=firefoxbrowser)](https://addons.mozilla.org/firefox/addon/syncnos-webclipper/)'
            printf '%s\n' '<details>'
            printf '%s\n\n' '<summary>Full changelog</summary>'
            cat "$generated_notes"
            printf '\n\n%s\n' '</details>'
          } > "$release_notes"

          gh release create "$RELEASE_TAG" release-artifacts/* --verify-tag --title "$RELEASE_TAG" --latest --notes-file "$release_notes"

      - name: Publish GitHub Pre-release
        if: ${{ steps.metadata.outputs.github_prerelease == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release-artifacts/* --verify-tag --title "$RELEASE_TAG" --prerelease --latest=false --notes ''
