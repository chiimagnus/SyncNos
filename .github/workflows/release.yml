name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.15.0 or v1.15.0-beta.1).'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  prepare_release:
    name: Validate and build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      channel: ${{ steps.metadata.outputs.channel }}
      npm_dist_tag: ${{ steps.metadata.outputs.npm_dist_tag }}
      github_prerelease: ${{ steps.metadata.outputs.github_prerelease }}
      npm_already_published: ${{ steps.preflight.outputs.npm_already_published }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Resolve release metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          node .github/scripts/cli/cli-release.mjs metadata "$RELEASE_TAG" > "$RUNNER_TEMP/release-metadata.json"
          node - "$RUNNER_TEMP/release-metadata.json" "$GITHUB_OUTPUT" <<'NODE'
          const fs = require('node:fs');
          const [metadataPath, outputPath] = process.argv.slice(2);
          const value = JSON.parse(fs.readFileSync(metadataPath, 'utf8'));
          fs.appendFileSync(outputPath, [
            `tag=${value.tag}`,
            `version=${value.version}`,
            `channel=${value.channel}`,
            `npm_dist_tag=${value.npmDistTag}`,
            `github_prerelease=${value.githubPrerelease}`,
            '',
          ].join('\n'));
          NODE
          node -e 'const [major, minor] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && minor < 5)) process.exit(1)' "$(npm --version)"

      - name: Preflight release state
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          NPM_DIST_TAG: ${{ steps.metadata.outputs.npm_dist_tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "release tag must point at a commit on main" >&2; exit 1; }

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release already exists: $RELEASE_TAG" >&2
            exit 1
          fi

          npm view @chiimagnus/syncnos dist-tags --json > "$RUNNER_TEMP/npm-dist-tags.json"
          published_version="$(npm view "@chiimagnus/syncnos@${RELEASE_VERSION}" version 2>/dev/null || true)"
          dist_tag_version="$(npm view @chiimagnus/syncnos "dist-tags.${NPM_DIST_TAG}" 2>/dev/null || true)"
          if [[ "$published_version" == "$RELEASE_VERSION" ]]; then
            if [[ "$dist_tag_version" != "$RELEASE_VERSION" ]]; then
              echo "npm exact version exists but ${NPM_DIST_TAG} points to ${dist_tag_version:-nothing}" >&2
              exit 1
            fi
            echo "npm_already_published=true" >> "$GITHUB_OUTPUT"
          else
            node .github/scripts/cli/cli-release.mjs check-order "$RELEASE_VERSION" "$RUNNER_TEMP/npm-dist-tags.json"
            echo "npm_already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run release gate
        run: npm run gate

      - name: Check CLI package contract
        run: npm run cli:check

      - name: Build SyncNos CLI tarball
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          node cli/package.mjs \
            --version "$RELEASE_VERSION" \
            --require-wxt-core-match \
            --out release-artifacts

      - name: Smoke install packaged SyncNos CLI
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          cli_tgz="$PWD/release-artifacts/chiimagnus-syncnos-${RELEASE_VERSION}.tgz"
          test -f "$cli_tgz"
          prefix="$(mktemp -d)"
          npm install -g "$cli_tgz" --prefix "$prefix" --ignore-scripts
          "$prefix/bin/syncnos" --help >/dev/null
          "$prefix/bin/syncnos" capabilities | node -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => (input += chunk));
            process.stdin.on("end", () => {
              const result = JSON.parse(input);
              if (result?.ok !== true || !Number.isInteger(result?.data?.protocolVersion)) process.exit(1);
            });
          '

      - name: Build browser release artifacts
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          node .github/scripts/webclipper/package-release-assets.mjs \
            --target=chrome \
            --zip \
            --zip-name="syncnos-webclipper-chrome-${RELEASE_TAG}.zip"
          cp "syncnos-webclipper-chrome-${RELEASE_TAG}.zip" "syncnos-webclipper-edge-${RELEASE_TAG}.zip"
          node .github/scripts/webclipper/package-release-assets.mjs \
            --target=firefox \
            --zip \
            --zip-name="syncnos-webclipper-firefox-${RELEASE_TAG}.xpi"
          node .github/scripts/webclipper/package-amo-source.mjs

          cp "syncnos-webclipper-chrome-${RELEASE_TAG}.zip" release-artifacts/
          cp "syncnos-webclipper-edge-${RELEASE_TAG}.zip" release-artifacts/
          cp "syncnos-webclipper-firefox-${RELEASE_TAG}.xpi" release-artifacts/
          cp SyncNos-WebClipper-amo-source.zip "release-artifacts/syncnos-webclipper-amo-source-${RELEASE_TAG}.zip"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts/
          if-no-files-found: error
          compression-level: 0

  publish_cli:
    name: Publish CLI to npm
    needs: prepare_release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node and npm registry
        if: ${{ needs.prepare_release.outputs.npm_already_published != 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Download release artifacts
        if: ${{ needs.prepare_release.outputs.npm_already_published != 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts

      - name: Publish SyncNos CLI to npm
        if: ${{ needs.prepare_release.outputs.npm_already_published != 'true' }}
        env:
          RELEASE_VERSION: ${{ needs.prepare_release.outputs.version }}
          NPM_DIST_TAG: ${{ needs.prepare_release.outputs.npm_dist_tag }}
        run: |
          set -euo pipefail
          cli_tgz="$PWD/release-artifacts/chiimagnus-syncnos-${RELEASE_VERSION}.tgz"
          npm publish "$cli_tgz" --access public --tag "$NPM_DIST_TAG"

      - name: Reuse existing npm publication
        if: ${{ needs.prepare_release.outputs.npm_already_published == 'true' }}
        run: echo "npm version already published with the expected dist-tag; continuing recovery"

  publish_chrome:
    name: Publish Chrome Web Store
    needs: prepare_release
    if: ${{ needs.prepare_release.outputs.github_prerelease == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare_release.outputs.tag }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts

      - name: Upload and publish Chrome Web Store artifact
        run: node .github/scripts/webclipper/publish-cws.mjs
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_ZIP_PATH: ${{ github.workspace }}/release-artifacts/syncnos-webclipper-chrome-${{ needs.prepare_release.outputs.tag }}.zip
          CWS_PUBLISH: 'true'
          CWS_PUBLISH_TARGET: default

  publish_edge:
    name: Publish Edge Add-ons
    needs: prepare_release
    if: ${{ needs.prepare_release.outputs.github_prerelease == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare_release.outputs.tag }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts

      - name: Upload and publish Edge Add-ons artifact
        run: node .github/scripts/webclipper/publish-edge.mjs
        env:
          EDGE_ADDONS_CLIENT_ID: ${{ secrets.EDGE_ADDONS_CLIENT_ID }}
          EDGE_ADDONS_API_KEY: ${{ secrets.EDGE_ADDONS_API_KEY }}
          EDGE_ADDONS_PRODUCT_ID: ${{ secrets.EDGE_ADDONS_PRODUCT_ID }}
          EDGE_ZIP_PATH: ${{ github.workspace }}/release-artifacts/syncnos-webclipper-edge-${{ needs.prepare_release.outputs.tag }}.zip
          EDGE_ADDONS_PUBLISH: 'true'
          EDGE_ADDONS_PUBLISH_NOTES: SyncNos WebClipper ${{ needs.prepare_release.outputs.tag }}

  publish_firefox:
    name: Publish Firefox AMO
    needs: prepare_release
    if: ${{ needs.prepare_release.outputs.github_prerelease == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare_release.outputs.tag }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts

      - name: Submit Firefox artifact to AMO
        run: node .github/scripts/webclipper/publish-amo.mjs
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          AMO_ADDON_ID: ${{ secrets.AMO_ADDON_ID }}
          AMO_CHANNEL: listed
          AMO_ADDON_SUMMARY: ${{ vars.AMO_ADDON_SUMMARY }}
          AMO_ADDON_SUMMARY_LOCALE: ${{ vars.AMO_ADDON_SUMMARY_LOCALE }}
          AMO_XPI_PATH: ${{ github.workspace }}/release-artifacts/syncnos-webclipper-firefox-${{ needs.prepare_release.outputs.tag }}.xpi
          AMO_SOURCE_ZIP_PATH: ${{ github.workspace }}/release-artifacts/syncnos-webclipper-amo-source-${{ needs.prepare_release.outputs.tag }}.zip

  github_release:
    name: Create GitHub Release
    needs: [prepare_release, publish_cli]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare_release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts

      - name: Resolve previous stable tag
        if: ${{ needs.prepare_release.outputs.github_prerelease == 'false' }}
        id: previous
        env:
          RELEASE_TAG: ${{ needs.prepare_release.outputs.tag }}
        run: |
          set -euo pipefail
          previous="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | grep -Fxv "$RELEASE_TAG" | head -n 1 || true)"
          echo "tag=$previous" >> "$GITHUB_OUTPUT"

      - name: Publish stable GitHub Release
        if: ${{ needs.prepare_release.outputs.github_prerelease == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare_release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare_release.outputs.version }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          set -euo pipefail
          generated_notes="$RUNNER_TEMP/github-generated-release-notes.md"
          release_notes="$RUNNER_TEMP/github-release-notes.md"
          api_args=(--method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f "tag_name=${RELEASE_TAG}")
          if [[ -n "$PREVIOUS_TAG" ]]; then
            api_args+=(-f "previous_tag_name=${PREVIOUS_TAG}")
          fi
          gh api "${api_args[@]}" --jq '.body' > "$generated_notes"
          [[ -s "$generated_notes" ]] || { echo "generated release notes are empty" >&2; exit 1; }

          {
            printf '%s\n\n' '[![Chrome Version](https://img.shields.io/chrome-web-store/v/hmgjflllphdffeocddjjcfllifhejpok?label=Chrome&logo=googlechrome)](https://chromewebstore.google.com/detail/syncnos-webclipper/hmgjflllphdffeocddjjcfllifhejpok) [![Edge Version](https://img.shields.io/badge/dynamic/json?url=https%3A%2F%2Fmicrosoftedge.microsoft.com%2Faddons%2Fgetproductdetailsbycrxid%2Fijkpghlfmkbjcgafapjcjahaikmnjncl&query=%24.version&label=Edge&logo=microsoftedge&color=blue)](https://microsoftedge.microsoft.com/addons/detail/syncnosaiweb-clipper/ijkpghlfmkbjcgafapjcjahaikmnjncl) [![Firefox Version](https://img.shields.io/amo/v/syncnos-webclipper?label=Firefox&logo=firefoxbrowser)](https://addons.mozilla.org/firefox/addon/syncnos-webclipper/)'
            printf '%s\n' '<details>'
            printf '%s\n\n' '<summary>Full changelog</summary>'
            cat "$generated_notes"
            printf '\n\n%s\n' '</details>'
          } > "$release_notes"

          gh release create "$RELEASE_TAG" \
            "release-artifacts/chiimagnus-syncnos-${RELEASE_VERSION}.tgz" \
            "release-artifacts/syncnos-webclipper-chrome-${RELEASE_TAG}.zip" \
            "release-artifacts/syncnos-webclipper-edge-${RELEASE_TAG}.zip" \
            "release-artifacts/syncnos-webclipper-firefox-${RELEASE_TAG}.xpi" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --latest \
            --notes-file "$release_notes"

      - name: Publish GitHub Pre-release
        if: ${{ needs.prepare_release.outputs.github_prerelease == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare_release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare_release.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "release-artifacts/chiimagnus-syncnos-${RELEASE_VERSION}.tgz" \
            "release-artifacts/syncnos-webclipper-chrome-${RELEASE_TAG}.zip" \
            "release-artifacts/syncnos-webclipper-edge-${RELEASE_TAG}.zip" \
            "release-artifacts/syncnos-webclipper-firefox-${RELEASE_TAG}.xpi" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --prerelease \
            --latest=false \
            --notes ''

  release_summary:
    name: Release summary
    if: ${{ always() }}
    needs: [prepare_release, publish_cli, publish_chrome, publish_edge, publish_firefox, github_release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Summarize channel results
        env:
          TAG: ${{ needs.prepare_release.outputs.tag }}
          PREPARE_RESULT: ${{ needs.prepare_release.result }}
          CLI_RESULT: ${{ needs.publish_cli.result }}
          CHROME_RESULT: ${{ needs.publish_chrome.result }}
          EDGE_RESULT: ${{ needs.publish_edge.result }}
          FIREFOX_RESULT: ${{ needs.publish_firefox.result }}
          GITHUB_RELEASE_RESULT: ${{ needs.github_release.result }}
        run: |
          {
            echo "## Release ${TAG:-unknown}"
            echo
            echo "| Channel | Result |"
            echo "| --- | --- |"
            echo "| Validate + build | ${PREPARE_RESULT} |"
            echo "| npm CLI | ${CLI_RESULT} |"
            echo "| GitHub Release | ${GITHUB_RELEASE_RESULT} |"
            echo "| Chrome Web Store | ${CHROME_RESULT} |"
            echo "| Edge Add-ons | ${EDGE_RESULT} |"
            echo "| Firefox AMO | ${FIREFOX_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"
