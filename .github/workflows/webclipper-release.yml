name: WebClipper Release Assets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to attach assets to (e.g. v0.1.0). Required for manual runs.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  webclipper_assets:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || !(contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc')) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Resolve tag name
        id: tag
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install WebClipper deps
        run: npm ci

      - name: WebClipper gate (lint/format/compile/test)
        run: npm run gate:ci

      - name: CLI package and installer tests
        run: npm test -- --run tests/unit/cli-package.test.ts tests/unit/cli-installer.test.ts

      - name: Build SyncNos CLI tgz
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          cli_version="${RELEASE_TAG#v}"
          mkdir -p release-artifacts
          node cli/package.mjs \
            --version "$cli_version" \
            --require-wxt-core-match \
            --out release-artifacts

      - name: Smoke install packaged SyncNos CLI
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          cli_version="${RELEASE_TAG#v}"
          cli_tgz="release-artifacts/syncnos-cli-${cli_version}.tgz"
          test -f "$cli_tgz"
          prefix="$(mktemp -d)"
          npm install -g "$cli_tgz" --prefix "$prefix" --ignore-scripts
          "$prefix/bin/syncnos" --help >/dev/null
          "$prefix/bin/syncnos" capabilities | node -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => (input += chunk));
            process.stdin.on("end", () => {
              const result = JSON.parse(input);
              if (result?.ok !== true || !Number.isInteger(result?.data?.protocolVersion)) process.exit(1);
            });
          '

      - name: Build WebClipper Chrome zip
        run: |
          set -euo pipefail
          node .github/scripts/webclipper/package-release-assets.mjs \
            --target=chrome \
            --zip \
            --zip-name="syncnos-webclipper-chrome-${{ steps.tag.outputs.name }}.zip"

      - name: Build WebClipper Edge zip
        run: |
          set -euo pipefail
          node .github/scripts/webclipper/package-release-assets.mjs \
            --target=edge \
            --out=dist-edge \
            --zip \
            --zip-name="syncnos-webclipper-edge-${{ steps.tag.outputs.name }}.zip"

      - name: Build WebClipper Firefox XPI
        run: |
          set -euo pipefail
          node .github/scripts/webclipper/package-release-assets.mjs \
            --target=firefox \
            --zip \
            --zip-name="syncnos-webclipper-firefox-${{ steps.tag.outputs.name }}.xpi"

      - name: Prepare release artifacts
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          cp "syncnos-webclipper-chrome-${{ steps.tag.outputs.name }}.zip" "release-artifacts/syncnos-webclipper-chrome-${{ steps.tag.outputs.name }}.zip"
          cp "syncnos-webclipper-edge-${{ steps.tag.outputs.name }}.zip" "release-artifacts/syncnos-webclipper-edge-${{ steps.tag.outputs.name }}.zip"
          cp "syncnos-webclipper-firefox-${{ steps.tag.outputs.name }}.xpi" "release-artifacts/syncnos-webclipper-firefox-${{ steps.tag.outputs.name }}.xpi"

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: |
            release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
