    <text x="104" y="410" fill="#777c86" font-size="22" font-weight="600">点击播放 · Watch on Bilibili</text>

    <g transform="translate(104 458)">
      <rect width="242" height="54" rx="18" fill="#fff1eb" stroke="#ffd8c8"/>
