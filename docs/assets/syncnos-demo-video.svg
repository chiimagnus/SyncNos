    <circle cx="209" cy="205" r="91" fill="#ffffff" opacity="0.97"/>
    <circle cx="209" cy="205" r="90" fill="none" stroke="#ffb297" stroke-width="4"/>
    <path d="M190 164 L190 246 L257 205 Z" fill="#24262b"/>

    <text x="209" y="350" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="750"
