<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="SyncNos product demo video on Bilibili">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf8"/>
      <stop offset="1" stop-color="#f2f4f7"/>
    </linearGradient>
    <linearGradient id="video" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2d33"/>
      <stop offset="1" stop-color="#17191e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc3ad"/>
      <stop offset="1" stop-color="#ff9e7d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1e2025" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#page)"/>

  <g filter="url(#shadow)">
    <rect x="54" y="54" width="1092" height="522" rx="36" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
    <g transform="translate(104 104)">
      <rect width="62" height="62" rx="18" fill="url(#accent)"/>
      <circle cx="43" cy="21" r="13" fill="#62c99d"/>
      <circle cx="29" cy="34" r="15" fill="#ffffff" stroke="#23252a" stroke-width="4"/>
      <circle cx="29" cy="34" r="6" fill="#f7c948" stroke="#23252a" stroke-width="3"/>
      <path d="M13 18 L22 8 L34 19" fill="none" stroke="#23252a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="184" y="136" fill="#24262b" font-size="30" font-weight="800">SyncNos</text>
    <text x="184" y="165" fill="#747983" font-size="16" font-weight="700" letter-spacing="1.8">WEBCLIPPER</text>

    <text x="104" y="282" fill="#24262b" font-size="66" font-weight="800" letter-spacing="-2">Product Demo</text>
