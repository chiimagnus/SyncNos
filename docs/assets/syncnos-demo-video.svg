  <g transform="translate(674 102)">
    <rect width="418" height="426" rx="30" fill="url(#video)"/>
    <rect x="1" y="1" width="416" height="424" rx="29" fill="none" stroke="#343740" stroke-width="2"/>

    <circle cx="346" cy="65" r="74" fill="#ffb297" opacity="0.16"/>
    <circle cx="54" cy="363" r="100" fill="#62c99d" opacity="0.13"/>

    <g opacity="0.42" stroke="#555a65" stroke-width="2">
      <path d="M42 94 H376"/>
      <path d="M42 332 H376"/>
      <path d="M112 42 V384"/>
      <path d="M306 42 V384"/>
